apiVersion: v1
kind: Pod
metadata:
  name: pma-tracker
  labels:
    app: pma-tracker
spec:
  hostUsers: false
  containers:
  - name: httpd
    image: busybox:1.36
    command:
    - /bin/sh
    - -c
    - |
      mkdir -p /data/js /data/libs
      exec /bin/httpd -f -p 8080 -h /data
    ports:
    - containerPort: 8080
      name: http
      protocol: TCP
    volumeMounts:
    - name: root-files
      mountPath: /data
    - name: js-files
      mountPath: /data/js
    - name: lib-files
      mountPath: /data/libs
    livenessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 3
      periodSeconds: 5
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  volumes:
  - name: root-files
    configMap:
      name: pma-tracker-root
      defaultMode: 0555
  - name: js-files
    configMap:
      name: pma-tracker-js
      defaultMode: 0555
  - name: lib-files
    configMap:
      name: pma-tracker-libs
      defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: pma-tracker
  labels:
    app: pma-tracker
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: pma-tracker
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: pma-tracker
  labels:
    app: pma-tracker
spec:
  host: pma-tracker-mfec-pma-tools.apps.ailab.mfec.co.th
  to:
    kind: Service
    name: pma-tracker
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
